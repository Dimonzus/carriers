<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточка перевозчика</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f172a; --muted:#64748b; --line:#e6eaf2;
    --brand:#2563eb; --brand-d:#1d4ed8;
    --green:#067647; --green-bg:#e7f6ef;
    --blue-bg:#e8efff; --amber-bg:#fff8eb; --amber-line:#f3e2b8;
  }
  *{box-sizing:border-box; margin:0}
  body{
    font-family:'Inter',system-ui,sans-serif; background:#f4f6fb;
    min-height:100vh; display:grid; place-items:center; padding:24px;
  }
  .carrier-card{
    width:100%; max-width:400px; background:#fff;
    border:1px solid var(--line); border-radius:24px; padding:20px;
    box-shadow:0 10px 30px rgba(15,23,42,.06);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .carrier-card:hover{ transform:translateY(-3px); box-shadow:0 18px 40px rgba(15,23,42,.10); }

  /* ── Шапка: доверие ───────────────────────── */
  .cc-header{ display:flex; align-items:center; gap:12px; }
  .cc-avatar{
    position:relative; flex:0 0 48px; height:48px; border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff;
    font-weight:700; font-size:20px; display:grid; place-items:center;
  }
  .cc-dot{ position:absolute; right:-1px; bottom:-1px; width:12px; height:12px;
    background:#22c55e; border:2px solid #fff; border-radius:50%; }
  .cc-name{ display:flex; align-items:center; gap:6px; font-size:18px; font-weight:700; }
  .cc-verified{ color:var(--brand); display:inline-flex; }
  .cc-meta{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .cc-rating{ margin-left:auto; text-align:right; }
  .cc-rating b{ font-size:15px; }
  .cc-rating span{ display:block; color:#f59e0b; font-size:11px; letter-spacing:1px; }

  /* ── Оплата ───────────────────────────────── */
  .cc-payments{ display:flex; gap:8px; margin-top:14px; }
  .pill{ display:inline-flex; align-items:center; gap:6px; padding:6px 11px;
    border-radius:999px; font-size:12px; font-weight:600; }
  .pill svg{ width:14px; height:14px; }
  .pill--cash{ background:var(--green-bg); color:var(--green); }
  .pill--card{ background:var(--blue-bg); color:var(--brand-d); }

  /* ── Характеристики плитками ──────────────── */
  .cc-specs{ list-style:none; padding:0; margin:14px 0 0;
    display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .spec{ background:#f6f8fc; border:1px solid #eef1f7; border-radius:14px; padding:10px 12px; }
  .spec--wide{ grid-column:1 / -1; }
  .spec svg{ width:16px; height:16px; color:var(--brand); margin-bottom:6px; }
  .spec-label{ display:block; font-size:11px; color:var(--muted); margin-bottom:2px; }
  .spec-value{ font-size:13.5px; font-weight:600; color:var(--ink); }

  /* ── Тариф ────────────────────────────────── */
  .cc-price{ margin-top:14px; display:flex; align-items:center; justify-content:space-between;
    background:var(--amber-bg); border:1px solid var(--amber-line);
    border-radius:14px; padding:10px 14px; }
  .cc-price-label{ display:flex; align-items:center; gap:8px; font-size:13px; color:#8a6d1f; font-weight:500; }
  .cc-price-label svg{ width:15px; height:15px; }
  .cc-price-value{ font-size:16px; font-weight:800; color:#8a6d1f; }

  /* ── Действия ─────────────────────────────── */
  .cc-actions{ display:flex; gap:10px; margin-top:16px; }
  .btn-call{
    flex:1; height:52px; border-radius:16px; text-decoration:none;
    background:linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff;
    font-weight:700; font-size:16px; letter-spacing:.2px;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 8px 20px rgba(37,99,235,.35);
    transition:transform .15s, box-shadow .15s;
  }
  .btn-call svg{ width:18px; height:18px; }
  .btn-call:hover{ transform:translateY(-1px); box-shadow:0 12px 26px rgba(37,99,235,.45); }
  .btn-call:active{ transform:translateY(0); }
  .btn-copy{
    width:52px; height:52px; border-radius:16px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--muted);
    display:grid; place-items:center; transition:.15s;
  }
  .btn-copy svg{ width:18px; height:18px; }
  .btn-copy:hover{ color:var(--brand); border-color:var(--brand); }
  .btn-copy .icon-check{ display:none; }
  .btn-copy.copied{ color:var(--green); border-color:var(--green); background:var(--green-bg); }
  .btn-copy.copied .icon-copy{ display:none; }
  .btn-copy.copied .icon-check{ display:block; }
  .btn-call:focus-visible, .btn-copy:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }

  @media (max-width:360px){ .cc-specs{ grid-template-columns:1fr; } .spec--wide{ grid-column:auto; } }
</style>
</head>
<body>

<article class="carrier-card">
  <!-- Шапка -->
  <header class="cc-header">
    <div class="cc-avatar">Д<span class="cc-dot" title="Онлайн"></span></div>
    <div>
      <h3 class="cc-name">Денис
        <span class="cc-verified" title="Проверенный перевозчик">
          <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><polyline points="16.5 9.5 10.7 15.3 7.8 12.4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </h3>
      <p class="cc-meta">Перевозчик · Минск</p>
    </div>
    <div class="cc-rating"><b>4.9</b><span>★★★★★</span></div>
  </header>

  <!-- Оплата -->
  <div class="cc-payments">
    <span class="pill pill--cash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/></svg>
      Нал
    </span>
    <span class="pill pill--card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      Безнал
    </span>
  </div>

  <!-- Характеристики -->
  <ul class="cc-specs">
    <li class="spec">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="1"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      <span class="spec-label">Грузоподъёмность</span>
      <span class="spec-value">до 3 т</span>
    </li>
    <li class="spec">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      <span class="spec-label">Тип кузова</span>
      <span class="spec-value">Будка</span>
    </li>
    <li class="spec spec--wide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      <span class="spec-label">Габариты кузова (Д × Ш × В)</span>
      <span class="spec-value">6.10 × 2.20 × 2.45 м</span>
    </li>
  </ul>

  <!-- Тариф -->
  <div class="cc-price">
    <span class="cc-price-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Тариф по городу
    </span>
    <span class="cc-price-value">50 руб.</span>
  </div>

  <!-- Действия -->
  <div class="cc-actions">
    <a class="btn-call" href="tel:+375336229477">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      +375 33 622-94-77
    </a>
    <button class="btn-copy" aria-label="Скопировать номер">
      <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </button>
  </div>
</article>

<script>
  document.querySelectorAll('.btn-copy').forEach(btn => {
    btn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText('+375 33 622-94-77'); } catch(e) {}
      btn.classList.add('copied');
      setTimeout(() => btn.classList.remove('copied'), 1600);
    });
  });
</script>
</body>
</html>
